<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Try the Look — Runway</title>
<meta name="description" content="Six looks, styled head to toe. Explore the runway, isolate a look, and tap a pin to see the piece.">
<link rel="preload" as="image" href="https://reel-ref-try-the-look.vercel.app/assets/model-1-640.webp" fetchpriority="high">
<style>
@font-face{font-family:Inter;src:url(https://reel-ref-try-the-look.vercel.app/assets/inter-600.woff2) format('woff2');font-weight:600;font-style:normal;font-display:swap}
*{box-sizing:border-box}
:root{color-scheme:light;--font-body--family:Helvetica,Arial,sans-serif;--font-body--weight:400;--font-heading--family:Helvetica,Arial,sans-serif;--font-heading--weight:400;--color-primary-button-background:#151413;--color-primary-button-text:#fff;--style-border-radius-buttons-primary:0px}
html,body{margin:0;padding:0;max-width:100%;font-family:Helvetica,Arial,sans-serif;color:#151413;background:#fff}
body{overflow-x:hidden}
button,input,select{font:inherit}
a{color:inherit;text-decoration:none}
button{color:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:2px solid #151413;outline-offset:4px}
[hidden]{display:none!important}

/* header */
.site-header{height:88px;padding:0 40px;display:flex;align-items:center;gap:32px;border-bottom:1px solid #e4e4e4;background:#fff;position:relative;z-index:50}
.brand{margin-right:auto;display:inline-flex}
.brand img{display:block;width:68px;height:24px;object-fit:contain}
.site-header nav{display:flex;gap:28px;font-size:14px;font-weight:600;font-family:Inter,Helvetica,Arial,sans-serif}
.site-header nav a{padding:12px 0}
.site-header nav a:hover{text-decoration:underline;text-underline-offset:4px}
#open-bag{display:flex;align-items:center;justify-content:center;gap:5px;background:none;border:0;min-width:44px;min-height:44px;cursor:pointer}
#open-bag [data-cart-count]{font-size:10px}

/* section tokens */
runway-section{
 --rw-h:var(--rw-h-d);--rw-sub:var(--rw-sub-d);--rw-label:var(--rw-label-d);--rw-chip:var(--rw-chip-d);--rw-ph:var(--rw-ph-d);--rw-pt-size:var(--rw-pt-size-d);--rw-price:var(--rw-price-d);--rw-opt:var(--rw-opt-d);--rw-total:var(--rw-total-d);--rw-thumb:var(--rw-thumb-d);
 --rw-panel-pad:32px;--rw-model-h:560px;
 --rw-stage:var(--rw-c-stage);--rw-panel:var(--rw-c-panel);--rw-text:var(--rw-c-text);--rw-head:var(--rw-c-text);--rw-muted:var(--rw-c-muted);--rw-accent:var(--rw-c-accent);--rw-on-accent:var(--rw-c-on-accent);--rw-line:var(--rw-c-line);
 --rw-btn-bg:var(--color-primary-button-background);--rw-btn-fg:var(--color-primary-button-text);
 --rw-ease:cubic-bezier(.16,1,.3,1);--rw-ease-silk:cubic-bezier(.65,0,.35,1);--rw-ease-spring:cubic-bezier(.34,1.56,.64,1);--rw-ease-sheet:cubic-bezier(.32,.72,0,1);--rw-pin-base:.15s;
 display:block;position:relative;color:var(--rw-text);background:var(--rw-panel);font-family:var(--font-body--family);font-weight:var(--font-body--weight);-webkit-font-smoothing:antialiased}
.rw__sticky{height:var(--rw-frame-h,100svh);display:flex;flex-direction:column}
.rw__grid{display:grid;grid-template-columns:minmax(0,1fr) var(--rw-panel-w);grid-template-rows:minmax(0,1fr);width:100%;max-width:var(--rw-max);margin:0 auto;flex:1 1 auto;min-height:0}
.rw__left{position:relative;display:flex;flex-direction:column;background:var(--rw-stage);overflow:hidden;min-height:0}
.rw__panel{position:relative;background:var(--rw-panel)}
.rw__panel.has-rule{border-left:1px solid var(--rw-line)}
.rw__panel-inner{position:absolute;inset:0;display:flex;flex-direction:column}
.rw__sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;margin:-1px;padding:0;border:0}

/* head */
.rw__head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding:44px 56px 0;z-index:5;position:relative}
.rw__intro{display:flex;flex-direction:column;gap:12px;max-width:640px}
.rw__title{margin:0;font-family:var(--rw-hf);font-weight:var(--rw-hw);font-size:var(--rw-h);line-height:1;letter-spacing:-.02em;color:var(--rw-head)}
.rw__sub{margin:0;font-size:var(--rw-sub);line-height:1.55;color:var(--rw-muted);max-width:46ch}

/* stage */
.rw__stage{position:relative;flex:1 1 auto;min-height:0;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;outline:none;overflow:hidden;z-index:0}
.rw.is-dragging .rw__stage{cursor:grabbing}
.rw__stage:focus-visible{box-shadow:inset 0 0 0 2px var(--rw-accent)}
.rw__actors{position:absolute;inset:0}
.rw__heroes{position:absolute;inset:0;pointer-events:none;z-index:1500}
.rw__model{position:absolute;left:0;bottom:0;transform-origin:50% 100%;will-change:transform,opacity;opacity:0}
.rw__figure{position:relative;height:var(--rw-model-h);aspect-ratio:var(--rw-ar)}
.rw__art{position:absolute;inset:0;transform:translateY(calc(var(--rw-foot,0) * 100%))}
.rw__art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 100%;pointer-events:none;-webkit-user-drag:none;opacity:0}
.rw__art img.is-decoded{opacity:1}
.rw__hit{position:absolute;inset:0;z-index:1;background:transparent;border:0;border-radius:24px;cursor:pointer;padding:0}
.rw__hit:focus-visible{outline:2px solid var(--rw-accent);outline-offset:6px}
.rw__shadow{position:absolute;left:58%;bottom:0;width:150%;height:9%;min-height:14px;max-height:46px;transform:translate(-50%,50%);filter:blur(2px);pointer-events:none;background:radial-gradient(closest-side,rgb(20 16 12/.30),rgb(20 16 12/.14) 45%,rgb(20 16 12/.04) 75%,rgb(20 16 12/0))}
.rw__hero{position:absolute;left:var(--rw-hx,72%);bottom:var(--rw-hy,30px);transform:translateX(-50%) scale(var(--rw-fs,1));transform-origin:50% 100%}
.rw__morph{position:relative;opacity:0;visibility:hidden}
.rw.rw--still .rw__hero.is-on .rw__morph{opacity:1;visibility:visible}
.rw.rw--still .rw__hero.is-on{pointer-events:auto}
.rw__zoom{position:absolute;inset:0;z-index:1;background:transparent;border:0;border-radius:24px;cursor:zoom-in;padding:0}
.rw__pins{position:absolute;inset:0;z-index:2;pointer-events:none}
.rw--popup .rw__heroes .rw__pins{display:none!important}
.rw__pin{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;background:transparent;border:0;padding:0;display:grid;place-items:center;cursor:pointer;pointer-events:auto}
.rw__pin-dot{position:relative;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgb(255 255 255/.86);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#151413;font-size:11px;font-weight:600;line-height:1;box-shadow:0 4px 14px -4px rgb(0 0 0/.35);transition:transform .5s cubic-bezier(.2,1.6,.4,1),background .25s,color .25s}
.rw__pin-dot::after,.rw__pin-dot::before{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid rgb(255 255 255/.8);animation:rw-ring 2.6s cubic-bezier(.2,.6,.3,1) infinite;pointer-events:none}
.rw__pin-dot::before{border-color:rgb(255 255 255/.55);animation-delay:1.3s}
.rw__pin:hover .rw__pin-dot,.rw__pin.is-hot .rw__pin-dot{transform:scale(1.3);background:var(--rw-accent);color:var(--rw-on-accent);box-shadow:0 0 0 6px color-mix(in srgb,var(--rw-accent) 22%,transparent),0 8px 20px -6px rgb(0 0 0/.45)}
.rw__pin:focus-visible{outline:none}
.rw__pin:focus-visible .rw__pin-dot{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--rw-accent)}
.rw__pin::after{content:attr(data-tip);position:absolute;left:calc(100% - 6px);top:50%;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:7px 12px;border-radius:999px;background:rgb(255 255 255/.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#151413;font-size:11px;font-weight:500;letter-spacing:.04em;line-height:1;box-shadow:0 10px 26px -12px rgb(0 0 0/.4);opacity:0;transform:translate(-8px,-50%) scale(.96);transform-origin:left;transition:opacity .35s,transform .6s var(--rw-ease);pointer-events:none}
.rw__pin.is-hot::after,.rw__pin:focus-visible::after{opacity:1;transform:translate(0,-50%)}
@media (hover:hover){.rw__pin:hover::after{opacity:1;transform:translate(0,-50%)}}
@keyframes rw-ring{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.7);opacity:0}}

/* sweep */
.rw__sweep{position:absolute;inset:0;z-index:1550;mix-blend-mode:soft-light;pointer-events:none;overflow:hidden}
.rw__sweep::before{content:"";position:absolute;top:-20%;bottom:-20%;left:0;width:42%;background:linear-gradient(100deg,transparent,rgb(255 255 255/.25) 42%,rgb(255 255 255/.55) 50%,rgb(255 255 255/.25) 58%,transparent);transform:translateX(-130%) skewX(-12deg);opacity:0}
.rw__stage.is-sweep .rw__sweep::before{animation:rw-sweep 1.5s var(--rw-ease-silk)}
@keyframes rw-sweep{0%{transform:translateX(-130%) skewX(-12deg);opacity:0}18%{opacity:1}100%{transform:translateX(330%) skewX(-12deg);opacity:0}}

/* cursor */
.rw--cursor .rw__stage,.rw--cursor .rw__stage *{cursor:none!important}
.rw__cursor{position:absolute;left:0;top:0;width:0;height:0;z-index:1700;pointer-events:none}
.rw__cursor-in{position:absolute;left:-42px;top:-42px;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;color:#151413;border:1px solid color-mix(in srgb,#151413 28%,transparent);background:color-mix(in srgb,#fff 40%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;transform:scale(.3);transition:transform .6s var(--rw-ease),opacity .35s,background .35s,border-color .35s,color .35s}
.rw__cursor-label{grid-area:1/1;font-size:10px;letter-spacing:.24em;padding-left:.24em;text-transform:uppercase;white-space:nowrap;transition:opacity .25s,letter-spacing .7s var(--rw-ease)}
.rw__cursor-view{opacity:0}
.rw__cursor.is-on .rw__cursor-in{opacity:1;transform:scale(1)}
.rw__cursor.is-view .rw__cursor-drag{opacity:0}.rw__cursor.is-view .rw__cursor-view{opacity:1}
.rw__cursor.is-link .rw__cursor-in{transform:scale(.2);background:var(--rw-accent);border-color:transparent}
.rw__cursor.is-link .rw__cursor-label{opacity:0}
.rw.is-dragging .rw__cursor.is-on .rw__cursor-in{transform:scale(.74);background:var(--rw-accent);border-color:var(--rw-accent);color:var(--rw-on-accent)}
.rw.is-dragging .rw__cursor-drag{letter-spacing:.42em;opacity:1}.rw.is-dragging .rw__cursor-view{opacity:0}

/* walk */
.rw__walk{display:none;position:absolute;left:50%;bottom:8px;z-index:1600;width:min(140px,38%);transform:translateX(-50%)}
.rw__walk-line{display:block;height:2px;background:color-mix(in srgb,var(--rw-text) 14%,transparent);position:relative;overflow:hidden}
.rw__walk-line::after{content:"";position:absolute;inset:0;background:var(--rw-accent);transform-origin:left;transform:scaleX(var(--rw-progress,.167));transition:transform 1.1s var(--rw-ease)}

/* controls */
.rw__controls{display:flex;align-items:center;gap:20px;padding:6px 44px 30px;z-index:5;position:relative}
.rw__icon{width:44px;height:44px;display:grid;place-items:center;border:0;background:none;color:var(--rw-text);position:relative;cursor:pointer;padding:0;flex:none}
.rw__icon::before{content:"";position:absolute;inset:2px;border-radius:50%;border:1px solid currentColor;opacity:0;transform:scale(.55);transition:transform .7s var(--rw-ease),opacity .4s}
.rw__icon:hover::before{opacity:.22;transform:scale(1)}
.rw__icon svg{transition:transform .5s cubic-bezier(.2,1.6,.4,1)}
[data-rw-prev]:hover svg{transform:translateX(-4px)}[data-rw-next]:hover svg{transform:translateX(4px)}
.rw__icon:active svg{transform:scale(.88)}
.rw__icon:focus-visible{outline:2px solid var(--rw-accent);outline-offset:2px;border-radius:4px}
.rw__auto .rw__i-pause{display:none}.rw.is-playing .rw__auto .rw__i-pause{display:block}.rw.is-playing .rw__auto .rw__i-play{display:none}
.rw__ticks{flex:1;display:flex;gap:6px;min-width:0}
.rw__tick{flex:0 1 44px;min-width:14px;height:44px;display:flex;flex-direction:column;justify-content:center;gap:9px;color:var(--rw-muted);text-align:left;background:none;border:0;padding:0;cursor:pointer;transition:flex-basis .8s cubic-bezier(.2,1.25,.3,1),color .3s}
.rw__tick[aria-current="true"]{flex:0 0 190px;color:var(--rw-text)}
.rw__tick:hover{color:var(--rw-text)}
.rw__tick-bar{display:block;height:2px;width:100%;overflow:hidden;position:relative;background:color-mix(in srgb,var(--rw-text) 14%,transparent);transition:transform .5s var(--rw-ease)}
.rw__tick:hover .rw__tick-bar{transform:scaleY(1.5)}
.rw__tick-bar::after{content:"";position:absolute;inset:0;background:var(--rw-text);transform:scaleX(0);transform-origin:left;transition:transform 1s var(--rw-ease),opacity .4s,background .4s}
.rw__tick.is-past .rw__tick-bar::after{transform:scaleX(1);opacity:.35}
.rw__tick[aria-current="true"] .rw__tick-bar::after{transform:scaleX(1);background:var(--rw-accent);opacity:1}
.rw.is-playing .rw__tick[aria-current="true"] .rw__tick-bar::after{transform:scaleX(0);transition:none}
.rw.is-playing .rw__tick.is-run .rw__tick-bar::after{animation:rw-fill var(--rw-speed) linear forwards}
@keyframes rw-fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.rw__tick-label{font-size:var(--rw-label);letter-spacing:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.rw__tick-name{display:none}
.rw__tick[aria-current="true"] .rw__tick-name{display:inline;animation:rw-name-in 1.1s var(--rw-ease) .1s backwards}
@keyframes rw-name-in{from{opacity:0;letter-spacing:.34em}}
.rw__tick:focus-visible{outline:2px solid var(--rw-accent);outline-offset:2px}

/* panel */
.rw__panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:44px var(--rw-panel-pad) 18px}
.rw__panel-title{margin:0;font-family:var(--rw-hf);font-weight:var(--rw-hw);font-size:var(--rw-ph);line-height:1.1}
.rw__label{font-size:var(--rw-label);letter-spacing:.16em;text-transform:uppercase;color:var(--rw-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.rw__label.is-swap{animation:rw-fade .8s var(--rw-ease)}
@keyframes rw-fade{from{opacity:0;transform:translateY(6px)}}
.rw__look-panel{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.rw__mhead{display:none}
.rw__items{list-style:none;margin:0;padding:6px var(--rw-panel-pad) 20px;display:flex;flex-direction:column;overflow-y:auto;flex:1 1 auto;min-height:0;overscroll-behavior:contain;scrollbar-width:thin}
.rw__item{position:relative;display:grid;grid-template-columns:var(--rw-thumb) minmax(0,1fr) 44px;column-gap:18px;align-items:center;padding:18px 0}
.has-dividers .rw__item{border-top:1px solid var(--rw-line)}
.has-dividers .rw__item:last-child{border-bottom:1px solid var(--rw-line)}
.rw__item::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--rw-accent);transform:scaleX(0);transform-origin:left;transition:transform .9s var(--rw-ease)}
.rw__item.is-hot::after{transform:scaleX(1)}
@media (hover:hover){.rw__item:hover::after{transform:scaleX(1)}}
.rw__media{display:block;position:relative;aspect-ratio:4/5;border-radius:var(--rw-thumb-radius);overflow:hidden;background:color-mix(in srgb,var(--rw-text) 5%,#fff)}
.rw__media img{display:block;width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--rw-ease)}
.rw__item:hover .rw__media img{transform:scale(1.07)}
@media (hover:none){.rw__item:hover .rw__media img{transform:none}}
.rw__num{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:rgb(255 255 255/.9);color:#151413;font-size:10px;font-weight:600;transition:background .3s,color .3s,transform .45s cubic-bezier(.2,1.6,.4,1)}
.rw__item.is-hot .rw__num,.rw__item:hover .rw__num{background:var(--rw-accent);color:var(--rw-on-accent);transform:scale(1.12)}
.rw__tag{position:absolute;top:calc(var(--rw-tag-top) - 7px);left:calc(var(--rw-tag-left) + 8px);z-index:2;display:flex;flex-direction:column;transform-origin:10px 0;pointer-events:none}
.rw__tag::before{content:"";width:1px;height:11px;margin-left:10px;background:color-mix(in srgb,var(--rw-text) 50%,transparent)}
.rw__tag-text{background:var(--rw-text);color:var(--rw-panel);font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:4px 6px;border-radius:2px}
.rw__item:hover .rw__tag{animation:rw-swing 1.4s cubic-bezier(.3,.7,.4,1)}
@keyframes rw-swing{0%{transform:rotate(-16deg)}25%{transform:rotate(11deg)}45%{transform:rotate(-7deg)}65%{transform:rotate(4deg)}82%{transform:rotate(-2deg)}100%{transform:rotate(0)}}
.rw__info{display:flex;flex-direction:column;gap:5px;min-width:0}
.rw__type{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--rw-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw__name{font-size:var(--rw-pt-size);font-weight:500;line-height:1.3;align-self:flex-start;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .7s var(--rw-ease)}
.rw__name:hover{background-size:100% 1px}
.rw__price{font-size:var(--rw-price);display:flex;gap:8px}
.rw__add{width:44px;height:44px;display:grid;place-items:center;border:0;background:none;padding:0;align-self:end;cursor:pointer;position:relative}
.rw__add svg{grid-area:1/1;transition:transform .55s cubic-bezier(.2,1.6,.4,1),opacity .2s}
.rw__add .rw__i-check,.rw__add .rw__i-spin{opacity:0}
.rw__add::before{content:"";position:absolute;inset:4px;border-radius:var(--rw-add-radius);border:1px solid currentColor;opacity:0;transform:scale(.55);transition:transform .7s var(--rw-ease),opacity .4s}
.rw__add:hover::before,.rw__item.is-picking .rw__add::before{opacity:.22;transform:scale(1)}
.rw__item.is-picking .rw__i-plus{transform:rotate(45deg)}
.rw__item.is-loading .rw__i-plus{opacity:0}
.rw__item.is-loading .rw__i-spin{opacity:1;animation:rw-spin .8s linear infinite}
@keyframes rw-spin{to{transform:rotate(360deg)}}
.rw__item.is-loading .rw__media::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgb(255 255 255/.5) 50%,transparent 70%);animation:rw-shimmer 1.1s infinite}
@keyframes rw-shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.rw__item.is-added .rw__i-plus{opacity:0}
.rw__item.is-added .rw__i-check{opacity:1;color:var(--rw-accent);animation:rw-pop .6s cubic-bezier(.2,1.6,.4,1)}
.rw__item.is-added .rw__i-check path{stroke-dasharray:24;stroke-dashoffset:24;animation:rw-draw .7s var(--rw-ease) .1s forwards}
.rw__item.is-added .rw__add::before{opacity:0}
.rw__item.is-added .rw__add::after{content:"";position:absolute;inset:4px;border-radius:var(--rw-add-radius);border:1px solid var(--rw-accent);animation:rw-burst 1s var(--rw-ease) forwards}
@keyframes rw-pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes rw-draw{to{stroke-dashoffset:0}}
@keyframes rw-burst{0%{transform:scale(.55);opacity:.9}100%{transform:scale(1.7);opacity:0}}

/* picker */
.rw__picker{grid-column:1/-1;display:flex;flex-direction:column;gap:14px;padding-top:16px;animation:rw-drop .7s var(--rw-ease)}
.rw__picker .rw__opt{animation:rw-rise .8s var(--rw-ease)}
.rw__picker .rw__confirm{animation:rw-rise .8s var(--rw-ease) .16s backwards}
@keyframes rw-drop{from{opacity:0;transform:translateY(-8px)}}
@keyframes rw-rise{from{opacity:0;transform:translateY(14px)}}
.rw__picker-head{display:none}
.rw__opt{border:0;padding:0;margin:0;min-width:0}
.rw__opt-name{font-size:var(--rw-opt);color:var(--rw-text);margin-bottom:8px;padding:0}
.rw__values{display:flex;flex-wrap:wrap;gap:8px}
.rw__pill{position:relative}
.rw__pill input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%}
.rw__pill-label{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:40px;padding:0 14px;border-radius:var(--rw-pill-radius);border:1px solid var(--rw-line);background:transparent;color:var(--rw-text);font-size:var(--rw-opt);transition:background .3s,color .3s,border-color .3s,transform .45s var(--rw-ease-spring),box-shadow .45s}
.rw__pill:hover .rw__pill-label{border-color:var(--rw-text)}
.rw__pill input:checked+.rw__pill-label{background:var(--rw-text);color:var(--rw-panel);border-color:var(--rw-text)}
.rw__pill:active .rw__pill-label{transform:scale(.94)}
